[pytest]
# Custom markers
markers =
    live: requires a live backend running on localhost:8000 (skipped by default)
    slow: long-running parametrized tests (skip with -m "not slow")

# Default: skip live-backend tests unless explicitly requested
# To run live tests: pytest -m live
# To run everything: pytest --override-ini="addopts="
addopts = -m "not live"
